name: Release verification

on:
  pull_request:
    paths:
      - src/doctor/sigstore.ts
      - tests/doctor-sigstore.test.ts
      - .github/workflows/release-verification.yml
      - release/**
  push:
    branches: [main]
    paths:
      - src/doctor/sigstore.ts
      - tests/doctor-sigstore.test.ts
      - .github/workflows/release-verification.yml
      - release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
      - name: Require Cosign
        run: cosign version
      - name: Verify release contract tests
        run: bun test tests/doctor-sigstore.test.ts
      - name: Verify controlled release artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_METADATA: release/metadata.json
        run: |
          test -f "$RELEASE_METADATA"
          bun -e '
            import { readFileSync } from "node:fs";
            import { parseReleaseMetadata, verifySigstore } from "./src/doctor/sigstore.ts";
            const metadata = parseReleaseMetadata(readFileSync(process.env.RELEASE_METADATA, "utf8"));
            const publicKey = readFileSync(metadata.publicKey);
            const result = verifySigstore(metadata, publicKey, (command) => Bun.spawnSync(command, { stdout: "inherit", stderr: "inherit" }).exitCode ?? 1);
            if (!result.verified) throw new Error(result.message);
          '
