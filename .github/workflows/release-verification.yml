name: Release verification

on:
  pull_request:
    paths:
      - src/doctor/sigstore.ts
      - src/updater/**
      - tests/doctor-sigstore.test.ts
      - tests/updater-coordinator.test.ts
      - .github/workflows/release-verification.yml
      - release/**
  push:
    branches: [main]
    paths:
      - src/doctor/sigstore.ts
      - src/updater/**
      - tests/doctor-sigstore.test.ts
      - tests/updater-coordinator.test.ts
      - .github/workflows/release-verification.yml
      - release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
      - name: Require Cosign
        run: cosign version
      - name: Verify release contract tests
        run: bun test tests/doctor-sigstore.test.ts tests/updater-coordinator.test.ts
      - name: Verify controlled release artifact and guard manifest
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_METADATA: release/metadata.json
        run: |
          test -f "$RELEASE_METADATA"
          bun -e '
            import { readFileSync } from "node:fs";
            import { coordinateUpdate } from "./src/updater/coordinator.ts";
            const metadataText = readFileSync(process.env.RELEASE_METADATA, "utf8");
            const metadata = JSON.parse(metadataText);
            coordinateUpdate({
              binaryPath: metadata.artifact,
              communityGuardDirectory: "release/current-community",
              releaseDirectory: ".",
              metadataText,
              pinnedPublicKey: readFileSync(metadata.publicKey),
              currentVersion: "0.0.0",
              run: (command) => Bun.spawnSync(command, { stdout: "inherit", stderr: "inherit" }).exitCode ?? 1,
              doctor: () => true,
              apply: false,
            });
          '
