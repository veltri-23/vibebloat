name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --omit peer
      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.1
      - name: Run Bun tests
        run: bun test
      - name: Run Hermes tests
        run: python -m pytest -q hermes/tests
      - name: Build distributions
        run: bun run build
      - name: Verify npm package surface
        run: npm pack --dry-run --ignore-scripts
      - name: Check patch whitespace
        run: git diff --check
